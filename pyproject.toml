[project]
name = "sera"
version = "1.0.0"
description = "Intelligent score editing and collaboration layer for professional notation environments."
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.2", "httpx2>=2.5"]
notation = [
    "music21>=9.1",
    "mido>=1.3",
    "pretty_midi>=0.2.10",
    "partitura>=1.6",
]
desktop = ["pyinstaller>=6.0"]
publication = ["python-docx>=1.1,<2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
"sera_edit.composer" = ["style_kb/*.json", "style_kb/packs/*.jsonl"]
