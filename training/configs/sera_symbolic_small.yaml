# Sera V0.2 symbolic training configuration for AutoDL smoke training.
# TODO: scale max_examples/model width for PDMX or MetaScore when budget allows.
seed: 42
model:
  architecture: decoder_only_transformer
  implementation: torch_native
  max_sequence_length: 512
  vocab_type: musicxml_event_tokens
  d_model: 128
  n_layers: 4
  n_heads: 4
  dim_feedforward: 512
  dropout: 0.1
  sample_max_new_tokens: 256
data:
  train_tokens: data/processed/musicxml_tokens.jsonl
  validation_split: 0.1
  min_frequency: 1
  max_examples: 600
optimization:
  batch_size: 8
  gradient_accumulation_steps: 1
  learning_rate: 0.0003
  epochs: 5
lora:
  enabled: false
  rank: 8
  alpha: 16
  dropout: 0.05
evaluation:
  metrics:
    - musicxml_validity_rate
    - midi_export_success_rate
    - pdf_export_success_rate
    - bar_completeness_score
    - pitch_range_validity_rate
    - empty_measure_rate
    - prompt_adherence_rule_score
    - revision_success_rate
