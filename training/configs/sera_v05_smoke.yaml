seed: 42
model:
  architecture: decoder_only_transformer
  implementation: torch_native
  max_sequence_length: 256
  seq_len: 256
  d_model: 128
  n_layers: 2
  n_heads: 4
  dim_feedforward: 512
  dropout: 0.15
  sample_max_new_tokens: 96
data:
  dataset_path: data/tokenized_v05/multitask_dataset.jsonl
  train_tokens: data/tokenized_v05/multitask_dataset.jsonl
  seq_len: 256
  validation_split: 0.1
  min_frequency: 1
  max_examples: 64
  tasks:
    - melody_fragment_generation
    - motif_variation
    - cadence_generation
    - rhythm_rewrite
training:
  batch_size: 2
  gradient_accumulation_steps: 1
  learning_rate: 0.0003
  num_epochs: 1
  fp16: false
  save_every_steps: 50
  eval_every_steps: 50
generation:
  temperature: 1.15
  top_p: 0.92
  top_k: 60
  repetition_penalty: 1.2
  no_repeat_ngram_size: 4
  max_consecutive_same_duration: 3
  duration_diversity_penalty: true
