name: Research CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-benchmark:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt -r requirements-publication.txt -c requirements-tested-windows.txt
      - name: Python regression
        run: python -m pytest -q
      - name: Validate the 120-task benchmark
        run: python scripts/validate_benchmark.py --split core
      - name: Run the offline reviewer demo
        run: python scripts/run_reviewer_demo.py --output-dir artifacts/softwarex_reviewer_demo
      - name: Verify the SoftwareX draft package
        run: python scripts/verify_softwarex_package.py --profile draft --output artifacts/softwarex_package_verification.json
      - name: Recompute frozen revision evidence and verify hashes
        run: python scripts/verify_reproducibility.py --experiment softwarex_revision_verification_120_v2 --skip-tests --output-dir artifacts/revision_reproducibility
      - name: Build a local source archive candidate
        run: python scripts/export_softwarex_package.py --artifact-label ci-candidate --output-dir artifacts/source_candidate
      - name: Verify the isolated source archive
        run: python scripts/verify_softwarex_source_archive.py artifacts/source_candidate/seraedit-ci-candidate-source.zip --output-dir artifacts/source_archive_verification
      - name: Preserve reviewer-demo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: softwarex-reviewer-demo
          path: artifacts/softwarex_reviewer_demo
          if-no-files-found: error
      - name: Preserve revision reproducibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: softwarex-revision-reproducibility
          path: |
            artifacts/revision_reproducibility
            artifacts/source_archive_verification
          if-no-files-found: warn

  frontend:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend regression
        working-directory: frontend
        run: npm test -- --run
      - name: Production build
        working-directory: frontend
        run: npm run build
